<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجلس الألعاب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ألعاب عائلية جماعية: مين أكون؟ وخمّن وش هو؟ ورتّبها صح وتحدي الحروف">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Changa:wght@600;700;800&display=swap">
<style>
/* One TV screen: a title, then four big game cards. Playful style: thick black outlines, offset shadows, flat bright colours. */
:root {
  --ink: #111827;
  --violet: #6366f1;
  --violet-2: #818cf8;
  --green: #10b981;
  --mint: #6ee7b7;
  --yellow: #fbbf24;
  --purple: #8b5cf6;
  --blue: #3b82f6;
  --peri: #a5b4fc;
  --line: clamp(3px, .25vw, 5px) solid var(--ink);
  --display: "Lalezar", "Changa", "Segoe UI", Tahoma, sans-serif;
  --body: "Changa", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font-family: var(--body);
  background: linear-gradient(135deg, var(--violet) 0%, var(--violet-2) 55%, var(--violet) 100%);
}
:focus-visible { outline: 5px solid var(--yellow); outline-offset: 4px; }
main {
  height: 100%; display: flex; flex-direction: column; gap: clamp(12px, 3vh, 36px);
  padding-block: clamp(14px, 4vh, 48px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1800px; margin: 0 auto;
}
h1 { margin: 0; text-align: center; font-family: var(--display); font-weight: 400; line-height: 1; font-size: clamp(40px, min(7vw, 11vh), 130px); }
h1 span { display: inline-block; color: #fff; background: var(--green); border: var(--line); box-shadow: .08em .08em 0 var(--ink); padding: .06em .3em 0; transform: rotate(-2deg); margin-inline-start: .15em; }
.games { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(12px, 2vw, 34px); }
.game {
  position: relative; min-height: 0; display: flex; flex-direction: column; gap: clamp(6px, 1.4vh, 16px); text-decoration: none; color: var(--ink);
  background: #fff; border: var(--line); border-radius: clamp(16px, 1.6vw, 28px); box-shadow: clamp(5px, .5vw, 10px) clamp(5px, .5vw, 10px) 0 var(--ink);
  padding: clamp(10px, 1.2vw, 20px); transition: transform .12s ease, box-shadow .12s ease;
}
.game:hover, .game:focus-visible { transform: translate(-4px, -4px); box-shadow: clamp(9px, .8vw, 14px) clamp(9px, .8vw, 14px) 0 var(--ink); outline: none; }
.game:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.art { flex: 1; min-height: 0; border: var(--line); border-radius: clamp(12px, 1.2vw, 20px); display: grid; place-items: center; overflow: hidden; }
.game h2 { margin: 0; text-align: center; font-family: var(--display); font-weight: 400; line-height: 1.1; font-size: clamp(24px, min(2.6vw, 5vh), 60px); }
.game p { margin: 0; text-align: center; font-weight: 700; color: #374151; font-size: clamp(13px, min(1.05vw, 2.1vh), 24px); line-height: 1.35; }
.chip { position: absolute; top: clamp(16px, 1.8vw, 30px); right: clamp(16px, 1.8vw, 30px); background: #fff; border: var(--line); border-radius: 999px; padding: 0 .8em; font-weight: 800; font-size: clamp(12px, min(.9vw, 1.8vh), 20px); }
.live { position: absolute; top: clamp(16px, 1.8vw, 30px); left: clamp(16px, 1.8vw, 30px); background: var(--green); color: #fff; border: var(--line); border-radius: 999px; padding: 0 .8em; font-weight: 800; font-size: clamp(12px, min(.9vw, 1.8vh), 20px); }
.live[hidden] { display: none; }
.g1 .art { background: var(--yellow); }
.g2 .art { background: repeating-conic-gradient(from 0deg at 50% 60%, var(--purple) 0 12deg, #7c3aed 12deg 24deg); }
.g3 .art { background: var(--mint); }
.g4 .art { background: linear-gradient(135deg, var(--peri), var(--blue)); }
.qmark { font-family: var(--display); font-size: clamp(70px, min(9vw, 18vh), 220px); line-height: 1; }
.emo { font-size: clamp(36px, min(4.4vw, 9vh), 110px); line-height: 1; white-space: nowrap; filter: drop-shadow(3px 3px 0 var(--ink)); }
.tiles { display: flex; gap: .2em; direction: rtl; font-size: clamp(26px, min(3.2vw, 7vh), 80px); }
.tiles i { font-style: normal; width: 1.2em; height: 1.3em; display: grid; place-items: center; padding-top: .1em; border: var(--line); border-radius: .25em; background: #fff; box-shadow: .08em .08em 0 var(--ink); }
.tiles.letters i { font-family: var(--display); }
.tiles.numbers i { font-weight: 800; }
.tiles i:nth-child(2) { transform: rotate(8deg); background: var(--yellow); }
.tiles i:nth-child(3) { transform: rotate(-6deg); background: var(--mint); }

/* tablets and phones: 2 × 2 grid, still one screen */
@media (max-width: 1000px) {
  .games { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .game p { display: none; }
}
@media (max-width: 1000px) and (max-height: 520px) {
  .games { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); }
}
.fs { position: fixed; top: clamp(10px, 1.6vh, 20px); left: max(12px, env(safe-area-inset-left, 0px)); z-index: 5; font: 800 clamp(13px, min(1vw, 1.9vh), 20px)/1 var(--body); color: var(--ink); background: #fff; border: var(--line); border-radius: 999px; padding: .55em 1em; box-shadow: 4px 4px 0 var(--ink); cursor: pointer; }
.fs:hover { background: var(--yellow); }
#play { position: fixed; inset: 0; z-index: 10; background: var(--violet); }
#play[hidden] { display: none; }
#play iframe { width: 100%; height: 100%; border: 0; display: block; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<button class="fs" id="fs" type="button">⛶ شاشة كاملة</button>
<main>
  <h1>مجلس<span>الألعاب!</span></h1>
  <nav class="games" aria-label="الألعاب">
    <a class="game g1" href="min-akoon.html">
      <div class="art"><span class="qmark" aria-hidden="true">؟</span></div>
      <span class="chip">2 – 6 فرق</span><span class="live" id="resume-a" hidden>محفوظة</span>
      <h2>مين أكون؟</h2>
      <p>أربع معلومات وتعرف الشخصية</p>
    </a>
    <a class="game g2" href="khammen.html">
      <div class="art"><span class="emo" aria-hidden="true">🐪☕🎲</span></div>
      <span class="chip">2 – 16 لاعب</span><span class="live" id="resume-b" hidden>محفوظة</span>
      <h2>خمّن وش هو؟</h2>
      <p>اسأل «إيه أو لا» وخمّن الشيء</p>
    </a>
    <a class="game g3" href="huruf.html">
      <div class="art"><div class="tiles letters" aria-hidden="true"><i>ح</i><i>ر</i><i>ف</i></div></div>
      <span class="chip">بلا حد</span><span class="live" id="resume-d" hidden>جارية</span>
      <h2>تحدي الحروف</h2>
      <p>رتّب الحروف وقل الكلمة أول</p>
    </a>
    <a class="game g4" href="rattebha.html">
      <div class="art"><div class="tiles numbers" aria-hidden="true"><i>1</i><i>2</i><i>3</i></div></div>
      <span class="chip">2 – 6 فرق</span><span class="live" id="resume-c" hidden>محفوظة</span>
      <h2>رتّبها صح</h2>
      <p>رتّب البطاقات قبل الفرق الثانية</p>
    </a>
  </nav>
</main>
<div id="play" hidden></div>
<script>
(function () {
  function saved(key, field, done) {
    try { var g = JSON.parse(localStorage.getItem(key) || "null"); return g && g[field] !== done; } catch (e) { return false; }
  }
  function refresh() {
    document.getElementById("resume-a").hidden = !saved("mak_game_v1", "status", "over");
    document.getElementById("resume-b").hidden = !saved("kh_game_v1", "phase", "over");
    document.getElementById("resume-c").hidden = !saved("rt_game_v1", "phase", "over");
    var on = false;
    try { var h = JSON.parse(localStorage.getItem("tahaddi-alhuruf-v1") || "null"); on = !!(h && h.game && ["playing", "paused", "won", "timeout", "revealed"].indexOf(h.game.status) >= 0); } catch (e) {}
    document.getElementById("resume-d").hidden = !on;
  }
  refresh();

  /* One continuous full screen: games open inside this page, so full screen never drops between games. */
  var play = document.getElementById("play"), frame = null, fsBtn = document.getElementById("fs");
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function enterFs() {
    var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!f) return;
    try { var pr = f.call(el); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
  }
  function exitFs() { var f = document.exitFullscreen || document.webkitExitFullscreen; if (f && isFs()) { try { var pr = f.call(document); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {} } }
  function tellFrame() { try { if (frame) frame.contentWindow.postMessage({ majlisFs: isFs() }, "*"); } catch (e) {} }
  function paintFs() { fsBtn.textContent = isFs() ? "✕ خروج من الشاشة الكاملة" : "⛶ شاشة كاملة"; tellFrame(); }
  ["fullscreenchange", "webkitfullscreenchange"].forEach(function (ev) { document.addEventListener(ev, paintFs); });
  fsBtn.addEventListener("click", function () { if (isFs()) exitFs(); else enterFs(); });

  function open(href, push) {
    // a new frame each time: its first load adds no browser-history entry of its own
    if (!frame || frame.getAttribute("src") !== href) {
      if (frame) frame.remove();
      frame = document.createElement("iframe");
      frame.name = "majlis-play"; frame.title = "اللعبة"; frame.setAttribute("allow", "fullscreen; autoplay"); frame.setAttribute("allowfullscreen", "");
      frame.setAttribute("src", href); frame.addEventListener("load", tellFrame);
      play.appendChild(frame);
    }
    play.hidden = false;
    if (push) try { history.pushState({ play: href }, "", "#play=" + href); } catch (e) {}
    setTimeout(function () { try { frame.contentWindow.focus(); } catch (e) {} }, 300);
  }
  function close() {
    play.hidden = true; if (frame) { frame.remove(); frame = null; } refresh();
    var first = document.querySelector(".game"); if (first) first.focus();
  }
  document.querySelector(".games").addEventListener("click", function (e) {
    var a = e.target.closest("a.game"); if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    e.preventDefault(); open(a.getAttribute("href"), true);
  });
  window.addEventListener("message", function (e) {
    if (!frame || e.source !== frame.contentWindow || !e.data || !e.data.majlis) return;
    var m = e.data.majlis;
    if (m === "home") { close(); try { history.replaceState(null, "", location.pathname + location.search); } catch (err) {} }
    else if (m === "fs-on") { enterFs(); setTimeout(tellFrame, 400); }
    else if (m === "fs-off") { exitFs(); setTimeout(tellFrame, 400); }
    else if (m === "hello") tellFrame();
  });
  window.addEventListener("popstate", function (e) {
    if (e.state && e.state.play) open(e.state.play, false); else if (!play.hidden) close();
  });
  var m = /^#play=([\w.-]+\.html)$/.exec(location.hash);
  if (m && document.querySelector('a.game[href="' + m[1] + '"]')) { try { history.replaceState({ play: m[1] }, "", location.hash); } catch (e) {} open(m[1], false); }
})();
</script>
</body>
</html>
