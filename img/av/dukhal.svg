<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="دخل">
  <!-- twig -->
  <path d="M4 54 C20 51 40 51 60 53" fill="none" stroke="#6b4a2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 52 C51 47 55 46 58 46 C56 50 52 52 48 52 Z" fill="#7fae5a" stroke="#4f6b33" stroke-width="1.2"/>
  <g stroke="#3d2e1f" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M42 36 L57 30 L56 38 L43 42 Z" fill="#7d5d3c"/>
    <!-- legs -->
    <path d="M29 46 L28 52 M35 46 L36 52" fill="none" stroke="#6b6b6b" stroke-width="1.8"/>
    <!-- round body -->
    <ellipse cx="32" cy="37" rx="13.5" ry="11" fill="#a58157"/>
    <!-- head -->
    <circle cx="21" cy="26" r="8.5" fill="#9b7a52"/>
    <!-- thin beak -->
    <path d="M13 26 L6.5 27.4 L13 29 Z" fill="#4b4038"/>
  </g>
  <!-- pale belly -->
  <path d="M22 38 C24 45 33 48 40 44 C34 45 27 43 22 38 Z" fill="#efe1c2"/>
  <!-- dark cap -->
  <path d="M14.5 22.5 C16 17 25 15.5 28.5 21 C24 19.5 19 20 14.5 22.5 Z" fill="#3b2f25"/>
  <!-- wing feathers -->
  <path d="M30 33 C36 31 42 33 44 37 M31 37 C36 35.5 41 37 43 40" fill="none" stroke="#6e5034" stroke-width="1.6" stroke-linecap="round"/>
  <!-- eye with a light ring -->
  <circle cx="18.5" cy="25.5" r="2.4" fill="#f5efe2"/>
  <circle cx="18.5" cy="25.5" r="1.4" fill="#111"/>
</svg>
