<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="حمامة">
  <defs>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fae86"/><stop offset="1" stop-color="#8d5fb0"/>
    </linearGradient>
  </defs>
  <g stroke="#3f4552" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M47 35 L61 31 L61 42 L47 42 Z" fill="#6c7487"/>
    <!-- legs -->
    <path d="M30 48 L28 56 M28 56 L24 57 M28 56 L31 58 M37 48 L37 56 M37 56 L33 57.5 M37 56 L40 58" fill="none" stroke="#d9465a" stroke-width="2"/>
    <!-- body -->
    <ellipse cx="34" cy="39" rx="16" ry="11" fill="#a3abbd"/>
    <!-- wing with two dark bars -->
    <path d="M30 33 C40 30 49 33 52 38 C46 43 37 43 30 40 Z" fill="#8a93a7"/>
    <!-- neck -->
    <ellipse cx="21" cy="30" rx="8" ry="9.5" fill="url(#neck)"/>
    <!-- head -->
    <circle cx="18" cy="20" r="7.5" fill="#97a0b3"/>
    <!-- beak -->
    <path d="M11 20.5 L5 22 L11 23.5 Z" fill="#3a3a3a"/>
  </g>
  <path d="M38 35.5 L46 36.5 M37 38.8 L46.5 39.5" stroke="#2c303a" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="11.5" cy="20" rx="2" ry="1.3" fill="#f1f1f1"/>
  <!-- orange eye -->
  <circle cx="16.5" cy="18.8" r="2.4" fill="#f59e0b"/>
  <circle cx="16.3" cy="18.8" r="1.1" fill="#111"/>
</svg>
