    <!-- body -->
    <ellipse cx="34" cy="43" rx="11.5" ry="11.5" fill="#e8bd7f"/>
    <!-- back ear -->
    <ellipse cx="29" cy="12" rx="4" ry="10" transform="rotate(14 29 12)" fill="#e8bd7f"/>
