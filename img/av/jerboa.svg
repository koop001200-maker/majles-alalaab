<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="جربوع">
  <g stroke="#5a3f20" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <!-- very long tail with a black-and-white tuft -->
    <path d="M42 46 C54 47 59 40 57 30 C56 24 55 20 55 15" fill="none" stroke-width="2.4"/>
    <ellipse cx="55" cy="11" rx="3.8" ry="5.5" fill="#1f1a12"/>
    <path d="M53.2 7.5 Q55 3.5 56.8 7.5 Q55 9.5 53.2 7.5 Z" fill="#fff"/>
    <!-- long hind foot -->
