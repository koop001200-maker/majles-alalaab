  <ellipse cx="20" cy="12" rx="2.2" ry="7.8" transform="rotate(-12 20 12)" fill="#f2a7a7"/>
  <ellipse cx="36" cy="46" rx="6.5" ry="7.5" fill="#f8e6c6"/>
  <!-- face -->
  <circle cx="19.5" cy="27" r="3.4" fill="#1f1a12"/>
  <circle cx="18.4" cy="25.8" r="1.1" fill="#fff"/>
  <circle cx="14" cy="31" r="1.4" fill="#e07a7a"/>
  <path d="M14 32 L7 31 M14 33 L7.5 35" stroke="#5a3f20" stroke-width="0.9" stroke-linecap="round"/>
